name: Trigger E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      repo_name:
        required: false
        type: string
      head_sha:
        required: false
        type: string

jobs:
  save_repo_name:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR repo and SHA
        env:
          REPO_NAME: ${{ github.event.inputs.repo_name || github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.inputs.head_sha || github.event.pull_request.head.sha }}
        run: |
          mkdir -p ./pr
          echo "$REPO_NAME" > ./pr/repo_name
          echo "$HEAD_SHA" > ./pr/head_sha
          echo "Saved repo: $REPO_NAME"
          echo "Saved sha: $HEAD_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: repo_name
          path: pr/
